<!DOCTYPE html>
    <html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Atualização de treino</title>
    </head>
    <body>
        <h1>Formulário de atualização por ID</h1>

        <form id="atualizar_treino">
            <label for="treino_id">ID: </label>
            <input type="number" name="treino_id" id="treino_id">

            <label for="treino_nome">Novo título: </label>
            <input type="text" name="treino_nome" id="treino_nome">

            <label for="treino_objetivo">Novo objetivo: </label>
            <input type="text" name="treino_objetivo" id="treino_objetivo">

            <label for="treino_data_fim">Nova data de fim: </label>
            <input type="date" name="treino_data_fim" id="treino_data_fim">

            <button type="submit"></button>
        </form>
        <script>
            const formulario = document.getElementById('atualizar_treino');
            
            formulario.addEventListener('submit', async (event) => {
                event.preventDefault();

                const id = formulario.elements.treino_id.value;
                const respostaConsulta = await fetch(`treinos/${id}`, {
                    method: 'PUT',
                    headers:{
                        'Content-Type':'application/json'
                    },
                    body:JSON.stringify({
                        treinoNome: formulario.elements.treino_nome,
                        treinoObjetivo: formulario.elements.treino_objetivo,
                        treinoDataFim: Date(formulario.elements.treino_data_fim)
                    })
                });

                alert(await respostaConsulta.text());
            })
        </script>
    </body>
</html>
