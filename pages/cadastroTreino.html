<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cadastro de fichas de treino</title>
    </head>
    
    <body>
        <h1>Cadastro de ficha</h1>
        <form action="/treinos/cadastro" method="POST">
            <label for="treino_nome">Título: </label>
            <input type="text" id="treino_nome" name="treino_nome" required>

            <label for="treino_objetivo">Objetivo: </label>
            <input type="text" id="treino_objetivo" name="treino_objetivo" required>

            <label for="treino_data_in">Data de início: </label>
            <input type="date" id="treino_data_in" name="treino_data_in">

            <label for="treino_data_fim">Data de término: </label>
            <input type="date" id="treino_data_fim" name="treino_data_fim">

            <button type="submit">Cadastrar</button>
        </form>
    </body>
</html>
