<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Deleção de ficha</title>
    </head>

    <body>
        <h1>Deleção de ficha</h1>

        <form id="delecao">
            <label for="ficha_id">ID da ficha: </label>
            <input type="text" id="ficha_id" size="30" maxlength="24"
                   pattern="[0-9a-fA-F]{24}" title="24 caracteres hexadecimais" required>

            <button type="submit">Deletar</button>
        </form>

        <p id="mensagem" role="status"></p>

        <script>
            const formulario = document.getElementById('delecao');
            const mensagem = document.getElementById('mensagem');

            formulario.addEventListener('submit', async (event) => {
                event.preventDefault();

                const id = document.getElementById('ficha_id').value.trim();

                if (!confirm(`Deseja realmente deletar a ficha ${id}?`)) return;

                try {
                    const resposta = await fetch(`/fichas/${id}`, { method: 'DELETE' });
                    const texto = await resposta.text();

                    mensagem.textContent = texto;

                    if (resposta.ok) formulario.reset();
                } catch (erro) {
                    console.error(erro);
                    mensagem.textContent = 'Erro de comunicação com o servidor';
                }
            });
        </script>
    </body>
</html>
