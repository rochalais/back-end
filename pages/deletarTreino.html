<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Deletar Treino</title>
    </head>
    <body>
        <h1>Deletar treino por ID</h1>

        <form id="formulario_delecao">
            <label for="treino_id">ID: </label>
            <input type="number" name="treino_id" id="treino_id" min="1" required>
            
            <button type="submit">Deletar</button>
        </form>

        <script>
            const formulario = document.getElementById('formulario_delecao');

            formulario.addEventListener('submit', async (event) => {
                event.preventDefault();

                const id = formulario.elements.treino_id.value
                const resposta = await fetch(`/treinos/${id}`, {
                    method: 'DELETE'
                });

                alert(await resposta.text());

                if(resposta.ok) formulario.reset();
            })
        </script>
    </body>
</html>
