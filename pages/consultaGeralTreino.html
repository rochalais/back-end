<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Lista de Treinos</title>
    </head>
    <body>
        <h1>Treinos cadastrados</h1>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Objetivo</th>
                    <th>Data de início</th>
                    <th>Data de fim</th>
                </tr>
            </thead>

            <tbody id="tabelaTreinos">
            </tbody>
        </table>
        <div>
            <button id="anterior" disabled>←</button>
            <span id="paginaAtual">Página 1</span>
            <button id="proxima">→</button>
        </div>
        <script>
            let paginaAtual = 1;
            let totalPaginas = 1;

            const tabela = document.getElementById('tabelaTreinos');
            const anterior = document.getElementById('anterior');
            const proxima = document.getElementById('proxima');
            const paginaTexto = document.getElementById('paginaAtual');

            async function carregarTreinos(pagina) {
                try {
                    const resposta = await fetch(`/treinos/consultaGeral?pagina=${pagina}`);

                    if (!resposta.ok) throw new Error('Erro ao consultar treinos');

                    const dados = await resposta.json();

                    tabela.innerHTML = '';

                    dados.registros.forEach(treino => {
                        const linha = document.createElement('tr');

                        linha.innerHTML = `
                            <td>${treino.id}</td>
                            <td>${treino.treinoNome}</td>
                            <td>${treino.treinoObjetivo}</td>
                            <td>${treino.treinoDataIn}</td>
                            <td>${treino.treinoDataFim}</td>
                        `;

                        tabela.appendChild(linha);
                    });

                    paginaAtual = dados.pagina;
                    totalPaginas = dados.totalPaginas;

                    paginaTexto.textContent =
                    `Página ${paginaAtual} de ${totalPaginas}`;

                    anterior.disabled = paginaAtual <= 1;
                    proxima.disabled = paginaAtual >= totalPaginas;

                } catch (erro) {
                    console.error(erro);
                }
            }

            anterior.addEventListener('click', () => {
                if (paginaAtual > 1)  carregarFichas(paginaAtual - 1);
            });

            proxima.addEventListener('click', () => {
            if (paginaAtual < totalPaginas) carregarFichas(paginaAtual + 1);
            });

            carregarTreinos(1);
        </script>
    </body>
</html>
