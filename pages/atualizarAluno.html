<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Atualizar Aluno</title>
</head>
<body>
  <h1>Atualizar aluno</h1>

  <form id="formAtualizarAluno">
    <p>ID:</p>
    <input type="number" name="id" required>

    <p>Nome:</p>
    <input type="text" name="nome" maxlength="100" required>

    <p>CPF:</p>
    <input type="text" name="cpf" maxlength="11" required>

    <p>E-mail:</p>
    <input type="email" name="email" required>

    <p>Telefone:</p>
    <input type="text" name="telefone" required>

    <p>Data de nascimento:</p>
    <input type="date" name="dataNascimento" required>

    <p>ID do plano:</p>
    <input type="number" name="planoId" min="1" required>

    <br><br>

    <button type="submit">Atualizar</button>

  </form>

  <p id="mensagem"></p>

  <script>
    const form = document.getElementById('formAtualizarAluno');
    const mensagem = document.getElementById('mensagem');


    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const id = form.elements.id.value;
      const resposta = await fetch(`/alunos/${id}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            nome: form.elements.nome.value,
            cpf: form.elements.cpf.value,
            email: form.elements.email.value,
            telefone: form.elements.telefone.value,
            dataNascimento: form.elements.dataNascimento.value,
            planoId: Number(form.elements.planoId.value)
          })
        });


      mensagem.textContent = await resposta.text();

    });

  </script>

</body>
</html>
