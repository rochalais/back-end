<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Atualização de ficha</title>
    </head>

    <body>
        <h1>Atualização de ficha</h1>

        <h2>1. Buscar fichas do treino</h2>
        <form id="busca">
            <label for="treino_id">ID do treino: </label>
            <input type="number" id="treino_id" min="1" required>
            <button type="submit">Buscar</button>
        </form>

        <div id="selecao" hidden>
            <label for="ficha_select">Ficha: </label>
            <select id="ficha_select"></select>
        </div>

        <form id="edicao" hidden>
            <h2>2. Editar ficha</h2>

            <p>ID da ficha: <span id="ficha_id"></span></p>

            <label for="dia">Dia: </label>
            <select id="dia" required>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
            </select>

            <h3>Exercícios</h3>
            <div id="lista_exercicios"></div>

            <button type="button" id="adicionar">Adicionar exercício</button>
            <button type="submit">Atualizar ficha</button>
        </form>

        <p id="mensagem" role="status"></p>

        <template id="modelo_exercicio">
            <div class="exercicio">
                <label>Nome: <input type="text" class="ex-nome" required></label>
                <label>Séries: <input type="number" class="ex-series" min="1" required></label>
                <label>Repetições: <input type="number" class="ex-repeticoes" min="1"></label>
                <button type="button" class="remover">Remover</button>
            </div>
        </template>

        <script>
            const formBusca = document.getElementById('busca');
            const selecao = document.getElementById('selecao');
            const fichaSelect = document.getElementById('ficha_select');
            const formEdicao = document.getElementById('edicao');
            const fichaIdTexto = document.getElementById('ficha_id');
            const diaSelect = document.getElementById('dia');
            const lista = document.getElementById('lista_exercicios');
            const modelo = document.getElementById('modelo_exercicio');
            const mensagem = document.getElementById('mensagem');

            let fichas = [];

            function adicionarLinha(exercicio) {
                lista.appendChild(modelo.content.cloneNode(true));
                const linha = lista.lastElementChild;

                if (exercicio) {
                    linha.querySelector('.ex-nome').value = exercicio.nome ?? '';
                    linha.querySelector('.ex-series').value = exercicio.series ?? '';
                    linha.querySelector('.ex-repeticoes').value = exercicio.repeticoes ?? '';
                }
                atualizarBotoesRemover();
            }

            function atualizarBotoesRemover() {
                const linhas = lista.querySelectorAll('.exercicio');
                linhas.forEach(l => l.querySelector('.remover').disabled = linhas.length === 1);
            }

            function carregarFicha(indice) {
                const ficha = fichas[indice];

                fichaIdTexto.textContent = ficha._id;
                diaSelect.value = ficha.dia;

                lista.innerHTML = '';
                ficha.exercicios.forEach(adicionarLinha);
                if (ficha.exercicios.length === 0) adicionarLinha();

                formEdicao.hidden = false;
            }

            function preencherSelecao() {
                fichaSelect.innerHTML = '';
                fichas.forEach((f, i) => {
                    const opcao = document.createElement('option');
                    opcao.value = i;
                    opcao.textContent = `Dia ${f.dia} (${f._id})`;
                    fichaSelect.appendChild(opcao);
                });
            }

            formBusca.addEventListener('submit', async (event) => {
                event.preventDefault();

                mensagem.textContent = '';
                selecao.hidden = true;
                formEdicao.hidden = true;

                const treinoId = document.getElementById('treino_id').value;

                try {
                    const resposta = await fetch(`/fichas/treino/${treinoId}`);

                    if (!resposta.ok) {
                        mensagem.textContent = await resposta.text();
                        return;
                    }

                    fichas = await resposta.json();

                    preencherSelecao();
                    selecao.hidden = false;
                    carregarFicha(0);
                    mensagem.textContent = `${fichas.length} ficha(s) encontrada(s)`;

                } catch (erro) {
                    console.error(erro);
                    mensagem.textContent = 'Erro de comunicação com o servidor';
                }
            });

            fichaSelect.addEventListener('change', () => carregarFicha(Number(fichaSelect.value)));

            document.getElementById('adicionar').addEventListener('click', () => adicionarLinha());

            lista.addEventListener('click', (event) => {
                if (!event.target.classList.contains('remover')) return;
                event.target.closest('.exercicio').remove();
                atualizarBotoesRemover();
            });

            formEdicao.addEventListener('submit', async (event) => {
                event.preventDefault();

                const indice = Number(fichaSelect.value);
                const id = fichas[indice]._id;
                const exercicios = [...lista.querySelectorAll('.exercicio')].map(linha => {
                    const exercicio = {
                        nome: linha.querySelector('.ex-nome').value.trim(),
                        series: Number(linha.querySelector('.ex-series').value)
                    };
                    const repeticoes = linha.querySelector('.ex-repeticoes').value;
                    if (repeticoes) exercicio.repeticoes = Number(repeticoes);
                    return exercicio;
                });

                const dados = { dia: Number(diaSelect.value), exercicios };

                try {
                    const resposta = await fetch(`/fichas/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(dados)
                    });

                    if (!resposta.ok) {
                        mensagem.textContent = await resposta.text();
                        return;
                    }

                    const corpo = await resposta.json();
                    fichas[indice] = corpo.ficha;
                    preencherSelecao();
                    fichaSelect.value = indice;

                    mensagem.textContent = corpo.mensagem;

                } catch (e) {
                    console.error(e);
                    mensagem.textContent = 'Erro de comunicação com o servidor';
                }
            });
        </script>
    </body>
</html>
