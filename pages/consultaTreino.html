<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Consulta de treinos</title>
    </head>
    
    <body>
        <h1>Consulta por ID</h1>
        <form id="consulta">
            <label for="treino_id">ID: </label>
            <input type="number" id="treino_id" name="treino_id" min=1 required>
            
            <button type="submit">Consultar </button>
        </form>


        <label for="treino_nome">Título: </p>
        <input type="text" id="treino_nome" name="treino_nome" readonly>

        <label for="treino_objetivo">Objetivo: </label>
        <input type="text" id="treino_objetivo" name="treino_objetivo" readonly>

        <label for="treino_data_in">Data de início: </label>
        <input type="date" id="treino_data_in" name="treino_data_in" readonly>

        </label for="treino_data_fim">Data de término: </label>
        <input type="date" id="treino_data_fim" name="treino_data_fim" readonly>

        <script>
            document.getElementById('consulta').addEventListener('submit', async (event) => {
                event.preventDefault();

                const id = document.getElementById('treino_id').value;
                const res = await fetch(`/treinos/${id}`);

                if(!res.ok){
                    alert('Treino não encontrado');
                    return;
                }

                const treino = await res.json();

                document.getElementById('treino_nome').value = treino.treinoNome;
                document.getElementById('treino_objetivo').value = treino.treinoObjetivo;
                document.getElementById('treino_data_in').value = treino.treinoDataIn;
                document.getElementById('treino_data_fim').value = treino.treinoDataFim;
            })
        </script>
    </body>
</html>
